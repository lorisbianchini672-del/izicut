# ============================================================
# CI — IziCut (Next.js 15 + Supabase + Stripe)
# ------------------------------------------------------------
# Lint + typecheck + tests + build sur chaque push/PR.
# Le job ne nécessite AUCUN secret : le build utilise des
# valeurs factices (les vraies clés vivent dans Vercel).
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (timestamps, sans clés)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build (valeurs factices, jamais de secrets ici)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
